[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-benchmark"
version = "0.1.0"
description = "Benchmark harness: Operaton vs Flowable as headless durable BPMN runtime"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a live engine (Operaton/Flowable) and PostgreSQL",
]
