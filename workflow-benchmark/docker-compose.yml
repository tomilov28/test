name: workflow-benchmark

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://benchmark:benchmark@postgres:5432/benchmark
      ENGINE_OPERATON_URL: http://operaton:8080/engine-rest
      ENGINE_FLOWABLE_URL: http://flowable:8081/flowable-rest/service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app-container"]

volumes:
  pgdata:
