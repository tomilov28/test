services:
  flowable:
    image: flowable/flowable-rest:8.0.0
    container_name: benchmark-flowable
    ports:
      - "8081:8080"
    mem_limit: ${FLOWABLE_MEM_LIMIT:-1024m}
    cpus: 2
    environment:
      # flowable-rest is a Spring Boot app (context-path /flowable-rest,
      # process REST under /service). Override the default H2 datasource with
      # the shared PostgreSQL (separate flowable database).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: benchmark
      SPRING_DATASOURCE_PASSWORD: benchmark
      # No bundled demo process definitions: keep the engine DB benchmark-clean.
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      WAIT_FOR: postgres:5432
      WAIT_FOR_TIMEOUT: "60"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 40s
    profiles: ["engine-flowable"]
